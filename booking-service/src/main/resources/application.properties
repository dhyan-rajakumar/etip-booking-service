spring.application.name=booking-service
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{correlationId}] %logger - %msg%n

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=RCADB;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=Admin@1234

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=booking-consumer-group
spring.kafka.consumer.auto-offset-reset=earliest